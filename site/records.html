    <section class="card section-card records-intro">

        <span class="pill">按日期留存 · 逐份核对</span>
        <h1 class="section-title">检查记录</h1>
        <p class="section-subtitle">把检查结果和医生原话放在一起，保留来源与待确认之处。</p>

      <div id="recordList" class="record-list"></div>
      <noscript><p class="record-notice">请启用 JavaScript 查看已核对的电子报告摘要。</p></noscript>

    <section class="card section-card wide-section">
      <div class="section-head"><div><h2 class="section-title">已有历史资料</h2><p class="section-subtitle">与本次安琪儿报告分开保留。</p></div></div>
      <a class="button-link secondary" href="reports/2026-05-24-blood-test.html">2026-05-24 · 早孕血检摘要</a>
